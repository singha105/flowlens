name: Weekly report

# Ingests the demo repo, builds the HTML report, and publishes it to GitHub Pages with the
# database it was built from (the snapshot the hosted dashboard downloads).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, once the last week is whole
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO: streamlit/streamlit

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --locked
      # The last run's database, so this one only fetches what changed. Without it (the
      # first run, or after GitHub evicts the cache) the ingest starts over: about 20 minutes.
      - name: Restore the last ingest
        uses: actions/cache@v6
        with:
          path: data
          key: flowlens-data-${{ github.run_id }}
          restore-keys: flowlens-data-
      - name: Ingest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run flowlens ingest --repo "$REPO" --since "$(date -u -d '2 years ago' +%F)"
      - name: Build the report
        run: |
          uv run flowlens report --repo "$REPO"
          cp "data/${REPO/\//__}.duckdb" site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
