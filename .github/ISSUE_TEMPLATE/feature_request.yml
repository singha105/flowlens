name: Feature request
description: A question FlowLens should answer, or a source it should read.
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: The question you want answered
      description: What decision would this help you make? For example, "how long do PRs wait after approval?"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you answer it today
  - type: textarea
    id: data
    attributes:
      label: Where the data lives
      description: Which GitHub signals (labels, reviews, deployments, workflow runs) or other tools hold it.
