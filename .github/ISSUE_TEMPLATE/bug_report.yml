name: Bug report
description: A command fails, or a number looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste tokens or private repository data.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The repository you ran FlowLens on (owner/name).
      placeholder: pallets/markupsafe
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and what it printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If a metric looks wrong, name an issue or PR it should (or shouldn't) count.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uv run flowlens --version`.
