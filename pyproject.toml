[project]
name = "flowlens"
version = "0.1.0"
description = "Agile flow metrics, Monte Carlo delivery forecasts, and DORA metrics from a GitHub repo's history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnab Singh" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/singha105/flowlens"

[project.scripts]
flowlens = "flowlens.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
