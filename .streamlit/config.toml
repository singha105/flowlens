# Streamlit settings for app/dashboard.py, locally and on Streamlit Community Cloud.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans-serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
